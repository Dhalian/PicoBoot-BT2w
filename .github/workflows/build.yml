name: Build PicoBoot BT 2W (official devcontainer)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to the exact commit ShitScripts/PicoBoot-BT2w's own
      # submodule reference points to, so my_platform.c's newer
      # Bluepad32 API usage (on_oob_event, btstack run-loop timer)
      # matches the library it was actually written against.
      - name: Fetch Bluepad32 (pinned to PicoBoot-BT2w's exact commit)
        run: |
          git clone https://github.com/ricardoquesada/bluepad32.git bluepad32
          cd bluepad32
          git checkout 6efa7123fe8badf5a40ad1205743a80b31c00ea4
          git submodule update --init --recursive

      - name: Download gekkoboot
        uses: robinraju/release-downloader@v1
        with:
          repository: 'webhdx/gekkoboot'
          latest: true
          fileName: '*.zip'
          out-file-path: gekkoboot
          extract: true

      - name: Copy gekkoboot.dol
        run: |
          cd gekkoboot
          cp gekkoboot.dol "${GITHUB_WORKSPACE}/payload.dol"

      - name: Build inside the official PicoBoot devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/webhdx/picoboot
          cacheFrom: ghcr.io/webhdx/picoboot
          push: never
          runCmd: |
            bash tools/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picoboot-bt2w-${{ steps.vars.outputs.sha_short }}
          path: dist/
